<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Management</title>
    <!-- Standalone on purpose: this page is not part of either bundle, so it
         cannot import src/styles.css. The few values here mirror the tokens
         there; if the palette moves, move these too. -->
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding: 40px 24px;
        background: #f4f5f1;
        color: #1a1c1a;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 34rem;
        margin: 0 auto;
        background: #fff;
        border: 1px solid #e9eae5;
        border-radius: 16px;
        box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04),
          0 8px 24px rgba(16, 24, 40, 0.06);
        padding: 28px;
      }
      h1 {
        font-size: 1.35rem;
        letter-spacing: -0.01em;
        margin: 0 0 12px;
      }
      p {
        color: #6b7280;
        line-height: 1.6;
        margin: 0 0 20px;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 8px;
      }
      a {
        display: block;
        padding: 12px 16px;
        border: 1px solid #dcded6;
        border-radius: 12px;
        color: #1a1c1a;
        font-weight: 550;
        text-decoration: none;
      }
      a:hover {
        background: #fafaf8;
        border-color: #16a34a;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Student Management — web tabs</h1>
      <p>
        This project ships two Zoho CRM web tabs. In CRM each is reached from
        the nav bar; this page exists only so they are easy to open during
        development.
      </p>
      <ul>
        <li><a href="./class-allocation.html">Class Allocation</a></li>
        <li><a href="./attendance-manager.html">Attendance Manager</a></li>
      </ul>
    </main>
  </body>
</html>
